[project]
name = "text2sql-agent"
version = "0.1.0"
description = "A stateful execution-guided Text-to-SQL framework using heterogeneous language models"
readme = "README.md"
authors = [
    { name = "XuanNguyen-UET", email = "hale29012004@gmail.com" }
]
requires-python = ">=3.10, <3.12"
dependencies = [
    "gradio>=4.40.0",
    "huggingface-hub>=0.25.0",
    "kagglehub>=0.2.0",
    "networkx>=3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "sqlglot>=25.0.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "vllm>=0.6.0",
]

[project.scripts]
text2sql-agent = "text2sql_agent:main"

[project.optional-dependencies]
train = [
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "func-timeout>=4.3.5",
    "peft>=0.12.0",
    "trl>=0.11.0",
    "wandb>=0.18.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

license = { text = "MIT" }
authors = [
    { name = "Cao Xuan Nguyen" }
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
