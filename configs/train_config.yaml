sft:
  base_model: "Qwen/Qwen2.5-Coder-7B-Instruct"
  dataset_path: "data/SFT_train_bird_norm_400.json"
  max_seq_length: 8192
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  learning_rate: 1.0e-4
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  weight_decay: 0.01

grpo:
  base_checkpoint: "checkpoints/sft_adapter"
  dataset_path: "data/train_grpo_dataset.json"
  learning_rate: 2.0e-5
  max_steps: 500
  num_generations: 4
  generation_batch_size: 2
  reward_weights:
    format: 1.0
    execution: 1.0
    match: 2.0
